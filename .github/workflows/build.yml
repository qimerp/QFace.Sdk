name: Build and Publish NuGet Packages

on:
  push:
    branches: [development, main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Fix documentation paths
        run: |
          ROOT_DIR=$(pwd)
          
          # Map SDK project names to their documentation files
          declare -A SDK_DOCS=(
            ["QFace.Sdk.ActorSystems"]="actor-system.md"
            ["QFace.Sdk.RabbitMq"]="rabbitmq-messaging.md"
            ["QFace.Sdk.RedisMq"]="rabbitmq-messaging.md"
            ["QFace.Sdk.SendMessage"]="send-message.md"
            ["QFace.Sdk.BlobStorage"]="blob-storage.md"
            ["QFace.Sdk.MongoDb"]="mongodb.md"
            ["QFace.Sdk.MongoDb.MultiTenant"]="mongodb.md"
            ["QFace.Sdk.ElasticSearch"]="elasticsearch.md"
            ["QFace.Sdk.Kafka"]="kafka-streaming.md"
            ["QFace.Sdk.Logging"]="logging.md"
            ["QFace.Sdk.Extensions"]="extensions.md"
            ["QFace.Sdk.AI"]="ai-sdk.md"
          )
          
          for project_dir in ./src/QFace.Sdk.*; do
            project_name=$(basename "$project_dir")
            echo "Processing $project_name..."
            
            # Skip template projects
            if [[ "$project_name" == "QFace.WebApi.Template" ]]; then
              echo "Skipping template project: $project_name"
              continue
            fi
            
            # Create docs directory structure
            mkdir -p "$project_dir/docs/shared"
            
            # Copy README.md
            if [ -f "README.md" ]; then
              cp README.md "$project_dir/"
              echo "  ✓ Copied README.md"
            fi
            
            # Copy SDK-specific documentation if mapped
            doc_file="${SDK_DOCS[$project_name]}"
            if [ -n "$doc_file" ] && [ -f "docs/$doc_file" ]; then
              cp "docs/$doc_file" "$project_dir/docs/"
              echo "  ✓ Copied docs/$doc_file"
            else
              echo "  ⚠ No documentation mapping found for $project_name"
            fi
            
            # Copy shared documentation
            if [ -d "docs/shared" ]; then
              cp -r docs/shared/* "$project_dir/docs/shared/"
              echo "  ✓ Copied shared documentation"
            fi
            
            # Update .csproj file paths
            project_file="$project_dir/$project_name.csproj"
            if [ -f "$project_file" ]; then
              sed -i 's|<None Include="\$(SolutionDir)README.md"|<None Include="README.md"|g' "$project_file"
              sed -i 's|<None Include="\$(SolutionDir)docs/|<None Include="docs/|g' "$project_file"
              echo "  ✓ Updated .csproj paths"
            fi
            
            echo ""
          done
          
          echo "Documentation setup complete!"

      - name: Build and Pack NuGet projects
        run: |
          mkdir -p ./nupkgs

          for project in ./src/*/*.csproj; do
            project_name=$(basename "$(dirname "$project")")

            if ! grep -q "<PackageId>" "$project"; then
              echo "  ⏭ Skipping $project_name (no PackageId)"
              continue
            fi
            if grep -q "<IsPackable>false</IsPackable>" "$project"; then
              echo "  ⏭ Skipping $project_name (IsPackable=false)"
              continue
            fi

            echo "📦 Processing $project_name..."
            # Restore against both the local nupkgs folder (for packages already packed
            # earlier in this same loop iteration) and nuget.org — otherwise a commit that
            # bumps several interdependent SDK packages together fails NU1102 here, since
            # the "Publish to NuGet" step only runs after this whole loop completes.
            dotnet restore "$project" -s ./nupkgs -s https://api.nuget.org/v3/index.json
            dotnet build "$project" -c Release --no-restore
            dotnet pack "$project" -c Release --no-build -o ./nupkgs
          done

          echo "Created packages:"
          ls -la ./nupkgs/

      - name: Publish to NuGet (OIDC trusted publishing)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          NUGET_USER: iamqwame
          NUGET_TOKEN_ENDPOINT: https://www.nuget.org/api/v2/token
          NUGET_SOURCE: https://api.nuget.org/v3/index.json
        run: |
          set -euo pipefail
          # Exchange GitHub OIDC → short-lived NuGet API key (same flow as NuGet/login).
          # Mint a fresh key per package: one OIDC token yields one API key.
          mint_nuget_key() {
            local oidc response
            oidc=$(curl -fsSL \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              -H "Accept: application/json; api-version=2.0" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fwww.nuget.org" \
              | jq -r '.value')
            response=$(curl -fsSL -X POST "$NUGET_TOKEN_ENDPOINT" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $oidc" \
              -d "{\"username\":\"$NUGET_USER\",\"tokenType\":\"ApiKey\"}")
            jq -er '.apiKey' <<<"$response"
          }

          shopt -s nullglob
          ordered=(./nupkgs/QFace.Sdk.Temporal.*.nupkg ./nupkgs/*.nupkg)
          seen=
          failed=0
          for pkg in "${ordered[@]}"; do
            base=$(basename "$pkg")
            case " $seen " in *" $base "*) continue ;; esac
            seen+=" $base"

            echo "Minting NuGet API key for $base..."
            api_key=$(mint_nuget_key)
            test -n "$api_key"
            echo "::add-mask::$api_key"
            echo "Pushing $base..."
            set +e
            out=$(dotnet nuget push "$pkg" \
              --api-key "$api_key" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate 2>&1)
            code=$?
            set -e
            echo "$out"
            if [[ $code -eq 0 ]]; then
              continue
            fi
            echo "Failed $base"
            failed=1
          done
          exit "$failed"
