name: Publish verified Common 3.11.41

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-qimerp-shared-common-3.11.41
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, qimerp-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify frozen package and source provenance
        working-directory: .release
        run: |
          set -euo pipefail
          sha256sum --check QimErp.Shared.Common.3.11.41.nupkg.sha256
          python3 - <<'PYTHON'
          import hashlib, json, pathlib, urllib.request, xml.etree.ElementTree as ET, zipfile
          root = pathlib.Path.cwd().parent
          manifest = json.loads(pathlib.Path("provenance.json").read_text())
          assert manifest["sha256"] == "32b1a1e413e065a2331c4df2921cc602a797578b15fd00d730efd9f9352be89e"
          assert hashlib.sha256(pathlib.Path("QimErp.Shared.Common.3.11.41.nupkg").read_bytes()).hexdigest() == manifest["sha256"]
          for name, digest in manifest["source_hashes"].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          with zipfile.ZipFile("QimErp.Shared.Common.3.11.41.nupkg") as archive:
              spec = ET.fromstring(archive.read("QimErp.Shared.Common.nuspec"))
              ns = {"n": "http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd"}
              assert spec.find("n:metadata/n:id", ns).text == "QimErp.Shared.Common"
              assert spec.find("n:metadata/n:version", ns).text == "3.11.41"
          with urllib.request.urlopen("https://api.nuget.org/v3-flatcontainer/qimerp.shared.common/index.json", timeout=30) as response:
              versions = json.load(response)["versions"]
          if "3.11.41" in versions:
              raise SystemExit("3.11.41 is already public; verify its contents before any further publication.")
          print("Frozen artifact, provenance, identity and unpublished version verified.")
          PYTHON

      - name: Locate installed .NET 9
        run: |
          set -euo pipefail
          dotnet_bin="${HOME}/.dotnet/dotnet"
          "$dotnet_bin" --list-sdks | grep '^9\.0\.' >/dev/null
          echo "${HOME}/.dotnet" >> "$GITHUB_PATH"

      - name: Authenticate with NuGet trusted publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: iamqwame

      - name: Publish exact verified artifact to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NUGET_API_KEY"
          dotnet nuget push .release/QimErp.Shared.Common.3.11.41.nupkg \
            --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
